name: Flatpak Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update -y
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Pre-install GNOME runtime and SDK
        run: |
          sudo flatpak install -y --noninteractive flathub \
            org.gnome.Platform/x86_64/48 \
            org.gnome.Sdk/x86_64/48 \
            org.freedesktop.Sdk.Extension.rust-stable/x86_64/24.08

      - name: Download flatpak-cargo-generator
        run: |
          curl -Lo flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py

      - name: Generate cargo sources
        run: |
          pip3 install toml tomlkit aiohttp
          python3 flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: tuxpad.flatpak
          manifest-path: com.tuxpad.TuxPad.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: tuxpad-flatpak
          path: tuxpad.flatpak
