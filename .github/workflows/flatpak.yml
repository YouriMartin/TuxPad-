name: Flatpak Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub/flatpak-builder-lint:buildbot
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download flatpak-cargo-generator
        run: |
          curl -Lo flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py

      - name: Generate cargo sources
        run: |
          pip3 install toml aiohttp
          python3 flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: tuxpad.flatpak
          manifest-path: com.tuxpad.TuxPad.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: tuxpad-flatpak
          path: tuxpad.flatpak
